<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 400" role="img" aria-label="Matriotic Studios LLC logo">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4A24C"/>
      <stop offset="100%" stop-color="#A67A2E"/>
    </linearGradient>
  </defs>
  <rect width="440" height="400" fill="#FBFAF7"/>

  <!-- LEFT PILLAR -->
  <g class="pillar pillar-left">
    <g class="pillar-cap" fill="url(#gold)">
      <polygon points="28,24 100,24 96,34 32,34"/>
      <polygon points="36,39 94,39 92,47 38,47"/>
    </g>
    <rect fill="#111111" x="45" y="56" width="37" height="133"/>
    <g class="pillar-base" fill="url(#gold)">
      <rect x="39" y="196" width="48" height="9"/>
      <rect x="33" y="208" width="60" height="9"/>
      <rect x="27" y="220" width="72" height="10"/>
    </g>
  </g>

  <!-- RIGHT PILLAR -->
  <g class="pillar pillar-right">
    <g class="pillar-cap" fill="url(#gold)">
      <polygon points="340,24 412,24 408,34 344,34"/>
      <polygon points="346,39 404,39 402,47 348,47"/>
    </g>
    <rect fill="#111111" x="358" y="56" width="37" height="133"/>
    <g class="pillar-base" fill="url(#gold)">
      <rect x="353" y="196" width="48" height="9"/>
      <rect x="347" y="208" width="60" height="9"/>
      <rect x="341" y="220" width="72" height="10"/>
    </g>
  </g>

  <!-- M -->
  <g class="m-letter" fill="#111111">
    <polygon points="90,196 90,62 128,62 128,196"/>
    <polygon points="312,196 312,62 350,62 350,196"/>
    <polygon points="128,62 166,62 220,118"/>
    <polygon points="312,62 274,62 220,118"/>
  </g>

  <!-- SHIELD: 6 wide panels, slanted tops following the V, single bottom point -->
  <g class="shield" fill="url(#gold)">
    <polygon class="shield-panel-1" points="134,180 161,163.1 161,191.6 134,176.7"/>
    <polygon class="shield-panel-2" points="163,161.8 190,144.9 190,207.5 163,192.5"/>
    <polygon class="shield-panel-3" points="192,143.7 219,126.6 219,223.5 192,208.6"/>
    <polygon class="shield-panel-4" points="221,126.6 248,143.7 248,208.6 221,223.5"/>
    <polygon class="shield-panel-5" points="250,144.9 277,161.8 277,192.5 250,207.5"/>
    <polygon class="shield-panel-6" points="279,163.1 306,180 306,176.7 279,191.6"/>
  </g>

  <!-- WORDMARK -->
  <text class="wordmark" x="220" y="296" text-anchor="middle"
        font-family="'Playfair Display',Didot,Georgia,'Times New Roman',serif"
        font-weight="800" font-size="52" letter-spacing="2" fill="#111111"
        textLength="368" lengthAdjust="spacingAndGlyphs">MATRIOTIC</text>

  <!-- SUBTITLE -->
  <line class="line-left" x1="40" y1="330" x2="102" y2="330" stroke="#B8893B" stroke-width="2"/>
  <line class="line-right" x1="338" y1="330" x2="400" y2="330" stroke="#B8893B" stroke-width="2"/>
  <text class="subtitle" x="220" y="338" text-anchor="middle"
        font-family="'Playfair Display',Didot,Georgia,'Times New Roman',serif"
        font-weight="600" font-size="22" letter-spacing="8" fill="#B8893B">STUDIOS LLC</text>
</svg>
